<div class="p-6">
  <h1 class="text-2xl font-semibold">Projets innovateurs</h1>
  <p class="mt-1 text-sm text-gray-500">Consultation staff des projets soumis.</p>

  @if (projectsResource.isLoading()) {
    <p class="mt-6 text-sm text-gray-500">Chargement…</p>
  } @else {
    <mat-card class="mt-6 overflow-hidden">
      <table mat-table [dataSource]="projects()">
        <ng-container matColumnDef="innovator">
          <th mat-header-cell *matHeaderCellDef>Innovateur</th>
          <td mat-cell *matCellDef="let row">{{ row.displayName }}</td>
        </ng-container>
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Titre</th>
          <td mat-cell *matCellDef="let row">{{ row.title }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let row">{{ row.status }}</td>
        </ng-container>
        <ng-container matColumnDef="consent">
          <th mat-header-cell *matHeaderCellDef>Consentement</th>
          <td mat-cell *matCellDef="let row">{{ row.publicationConsent }}</td>
        </ng-container>
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef>Mise à jour</th>
          <td mat-cell *matCellDef="let row">{{ formatDate(row.updatedAt) }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <a matButton="outlined" [routerLink]="['/admin/projets', row.id]">Voir</a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <mat-paginator [length]="total()" [pageSize]="pageSize()" [pageIndex]="page() - 1" (page)="changePage($event)" />
    </mat-card>
  }
</div>
