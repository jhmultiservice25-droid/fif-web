<section>
  <h1 class="text-3xl font-semibold tracking-tight">Confirmer votre e-mail</h1>
  <p class="mb-2 mt-2 text-sm text-gray-500">
    Un code de confirmation à 6 chiffres a été envoyé à :
  </p>
  <p class="mb-6 break-all text-sm font-medium text-gray-800">{{ email() }}</p>

  @if (error()) {
    <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      {{ error() }}
    </div>
  }

  @if (message()) {
    <div class="mb-5 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
      {{ message() }}
    </div>
  }

  <form class="flex flex-col gap-4" (submit)="verify(); $event.preventDefault()">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Code de confirmation</mat-label>
      <input
        matInput
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="000000"
        (input)="onOtpInput($event)" />
      <mat-hint>Le code expire après 5 minutes.</mat-hint>
    </mat-form-field>

    <button
      matButton="filled"
      class="mt-2 w-full"
      type="submit"
      [disabled]="isLoading() || otp().length !== 6">
      {{ isLoading() ? 'Vérification…' : 'Confirmer mon e-mail' }}
    </button>
  </form>

  <button
    matButton
    type="button"
    class="mt-3 w-full"
    [disabled]="isResending()"
    (click)="resend()">
    {{ isResending() ? 'Envoi…' : 'Renvoyer le code' }}
  </button>

  <p class="mt-6 text-center text-sm text-gray-500">
    Mauvaise adresse e-mail ?
    <a routerLink="/auth/choice" class="font-medium text-primary-600 hover:underline">Recommencer l’inscription</a>
  </p>
</section>
