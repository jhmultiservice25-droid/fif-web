<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-[background-color,border-color,box-shadow] duration-300"
  [class.border-transparent]="!solidHeader()"
  [class.bg-transparent]="!solidHeader()"
  [class.border-gray-200/80]="solidHeader()"
  [class.bg-white/95]="solidHeader()"
  [class.shadow-sm]="solidHeader()"
  [class.backdrop-blur-xl]="solidHeader()">
  <nav class="mx-auto flex max-w-screen-2xl items-center py-4 justify-between px-6 sm:px-8 lg:px-16 xl:px-24 2xl:px-32">
    <a routerLink="/" class="flex items-center gap-2" aria-label="FIF 2026, accueil" (click)="closeMenu()">
      <img src="/images/favicon.png" alt="" class="size-6 object-contain md:size-8" />
      <span
        class="text-xl font-bold tracking-tight transition-colors md:text-2xl"
        [class.text-white]="!isScrolled()"
        [class.text-gray-950]="solidHeader()">
        FIF<span class="text-primary-400">2026</span>
      </span>
    </a>

    <div class="hidden h-full items-center gap-8 lg:flex">
      @for (link of links; track link.name) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive
          #desktopLink="routerLinkActive"
          [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
          class="flex h-full items-center py-2 border-b-2 px-0.5 pt-0.5 text-sm font-semibold transition-colors"
          [class]="navLinkClasses(desktopLink.isActive)">
          {{ link.name }}
        </a>
      }
      <div class="hidden items-center gap-2 sm:flex">
        <a mat-flat-button routerLink="/auth/connexion">Connexion</a>
      </div>
    </div>

    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-full border shadow-sm transition-colors sm:hidden"
      [class]="!isScrolled() ? 'border-white/25 bg-white/10 text-white' : 'border-gray-200 bg-white text-gray-900'"
      (click)="toggleMenu()">
      <mat-icon [svgIcon]="isMenuOpen() ? 'x' : 'menu'" />
    </button>
  </nav>

  @if (isMenuOpen()) {
    <div id="mobile-navigation" class="border-t border-gray-100 bg-white px-6 py-6 shadow-xl sm:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.name) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment ?? undefined"
            routerLinkActive
            #mobileLink="routerLinkActive"
            [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-base font-semibold transition"
            [class]="mobileNavLinkClasses(mobileLink.isActive)"
            (click)="closeMenu()">
            <mat-icon class="size-5" [svgIcon]="link.icon" />
            {{ link.name }}
          </a>
        }
      </div>
    </div>
  }
</header>
